<body>
<!-- the same backdrop the landing page draws, from the same generated renderer -->
<div id="basebg" style="position:fixed;inset:0;overflow:hidden;background:#050505"><canvas id="baseimg" style="position:absolute;top:0;left:0;width:300vw;height:100%"></canvas></div>

<div id="vig" style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 50%, rgba(0,0,0,0.5) 86%, rgba(0,0,0,0.68) 100%)"></div>
<div id="scrim" style="position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;background:linear-gradient(to top, rgba(3,3,3,0.6), rgba(3,3,3,0.22) 45%, transparent)"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:24px 7vw;pointer-events:none">

  <nav style="display:flex;align-items:center;gap:28px;pointer-events:auto">
    <a href="mailto:hq@hizen.vc" class="clink" style="font-size:12px;letter-spacing:0.05em">Contact us</a>
  </nav>
</header>
<main style="position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:15vh 7vw 10vh;box-sizing:border-box">
  <div style="display:flex;gap:12px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:22px;color:rgba(244,243,240,0.62)"><span>Demo</span>1 min 30 sec</div>
  <h1 style="margin:0;font-weight:600;font-size:clamp(30px,3.5vw,50px);line-height:1.05;letter-spacing:-0.035em;max-width:20ch;text-align:center;text-wrap:pretty">Deck in, brief out. The whole pre-call layer.</h1>

  </div>
  <div style="margin-top:56px;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:10px;letter-spacing:0.08em;color:rgba(244,243,240,0.42)">© 2026 hizen.vc · intelligence for private capital</div>
</main>
<script>
(() => {
  const base = document.getElementById('baseimg'), spotc = document.getElementById('spotimg');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2, 8000 / Math.min(6400, window.innerWidth * 3));
    HizenBackdrop._drawVines(base, false, dpr);
    HizenBackdrop._drawVines(spotc, true, 0.5);
  };
  draw();
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 200); });

  const spot = document.getElementById('spot');
  if (still) return;
  const m = { x: -999, y: -999 }, sm = { x: -999, y: -999 };
  addEventListener('mousemove', e => {
    if (m.x < -500) { sm.x = e.clientX; sm.y = e.clientY; }
    m.x = e.clientX; m.y = e.clientY;
  }, { passive: true });
  (function loop() {
    sm.x += (m.x - sm.x) * 0.1; sm.y += (m.y - sm.y) * 0.1;
    const g = 'radial-gradient(circle 260px at ' + sm.x.toFixed(1) + 'px ' + sm.y.toFixed(1) +
      'px, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0.75) 60%, rgba(0,0,0,0.4) 75%, rgba(0,0,0,0.12) 88%, transparent 100%)';
    spot.style.webkitMaskImage = g; spot.style.maskImage = g;
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
