<!DOCTYPE html>
<!-- HAND-AUTHORED, like demo.html. The builder export has no form backend and
     no fund-type field, so a re-export must map this page as `-contact.dc.html`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get in touch — hızen.vc</title>
  <link rel="stylesheet" href="./fonts/fonts.css">
  <style>
    body{margin:0;background:#050505;color:#f4f3f0;-webkit-font-smoothing:antialiased}
    a{color:#f4f3f0}a:hover{color:#b5b2a8}
    ::selection{background:#f4f3f0;color:#12120f}
    input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-bottom-color:#f4f3f0 !important}
    /* The four fields repeated these inline nine times over. */
    .f{display:flex;flex-direction:column;gap:9px;font-family:'IBM Plex Mono',monospace;
       font-weight:500;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;
       color:rgba(244,243,240,0.55)}
    .f input,.f select{background:transparent;border:none;border-bottom:1px solid rgba(244,243,240,0.28);
       padding:8px 0 10px;font-family:Inter,sans-serif;font-size:15px;color:#f4f3f0;border-radius:0}
    /* A native select paints its own chrome; strip it and draw one caret. */
    .f select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,rgba(244,243,240,0.55) 50%),linear-gradient(135deg,rgba(244,243,240,0.55) 50%,transparent 50%);background-position:right 6px center,right 1px center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
    .f option{background:#12120f;color:#f4f3f0}
    .f .opt{text-transform:none;letter-spacing:0;font-size:10px;color:rgba(244,243,240,0.34)}
    button[disabled]{opacity:0.5;cursor:default}
  </style>
<meta name="description" content="Everything an analyst runs before a deal — done, before the call.">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32-dark.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32-light.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/img/icon-180-dark.png">
<meta property="og:title" content="hızen.vc — intelligence for private capital">
<meta property="og:description" content="Everything an analyst runs before a deal — done, before the call.">
<meta property="og:image" content="https://hizen.vc/img/og.png">
<meta property="og:url" content="https://hizen.vc/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="hızen.vc — intelligence for private capital">
<meta name="twitter:description" content="Everything an analyst runs before a deal — done, before the call.">
<meta name="twitter:image" content="https://hizen.vc/img/og.png">
<style>
  /* The builder writes hover intent as a `style-hover` attribute its own runtime
     never reads, so these are the only place those states exist. */
  .clink:hover { color: #b5b2a8 }
  .cbtn:hover { background: #d9d6cd; color: #12120f }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px }

  /* A flex column with `align-items:center` sizes its children to max-content,
     so the headline spans and the copy blocks never wrap — they overflow the
     5vw padding and `overflow-x:hidden` clips them. This is the whole mobile
     bug on every page; it is not width-specific, so it is not in a query. */
  .stmt > *, main > * { max-width: 100% }

  @media (max-width: 640px) {
    header { padding-left: 5vw !important; padding-right: 5vw !important }
    header nav { gap: 14px !important }
    /* "Get in touch" reaches the same inbox and the row cannot hold both */
    header nav a[href^="mailto:"] { display: none !important }
    .rv { max-width: 100% !important }
    .stmt { padding: 0 6vw !important }
    .stmt > * { font-size: clamp(26px, 7.4vw, 40px) !important; letter-spacing: -0.04em !important }
    /* grid and flex children default to min-width:auto, so an input's default
       size keeps two columns wider than the screen instead of collapsing */
    [style*="grid-template-columns"] { grid-template-columns: 1fr !important }
    input, textarea { min-width: 0 !important; width: 100% !important }
  }
</style>
</head>
<body>
<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 50%, rgba(0,0,0,0.5) 86%, rgba(0,0,0,0.68) 100%)"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:24px 7vw">
  <a href="./index.html" style="font-family:'Space Grotesk',Inter,sans-serif;font-weight:500;font-size:20px;letter-spacing:0.005em;color:#f4f3f0;text-decoration:none;line-height:1">h<span style="position:relative;display:inline-block">ı<span style="position:absolute;left:50%;top:0.06em;transform:translateX(-50%);width:0.17em;height:0.17em;border-radius:50%;background:#8f8c85"></span></span>zen<span style="color:#8f8c85">.vc</span></a>
  <nav style="display:flex;align-items:center;gap:28px"><a href="mailto:hq@hizen.vc" style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0.05em;color:#f4f3f0;text-decoration:none;border-bottom:1px solid rgba(244,243,240,0.35);padding-bottom:3px;white-space:nowrap" style-hover="color:#b5b2a8">Contact us</a><a href="./demo.html" style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0.05em;color:#12120f;background:#f4f3f0;padding:10px 20px;border-radius:999px;text-decoration:none;white-space:nowrap" style-hover="background:#d9d6cd;color:#12120f">See demo</a></nav>
</header>
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 7vw 80px;box-sizing:border-box">
  <div style="width:min(560px,100%)">
    <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(244,243,240,0.5);margin-bottom:16px">+ Contact</div>
    <h1 style="margin:0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(38px,5vw,62px);line-height:1.02;letter-spacing:-0.04em;color:#ffffff">Get in touch.</h1>
    <p style="margin:20px 0 0;font-family:Inter,sans-serif;font-weight:400;font-size:15px;line-height:1.7;color:rgba(244,243,240,0.78)">Tell us about your fund and we'll come back within a day - or write to us directly at <a href="mailto:hq@hizen.vc" style="font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#f4f3f0;text-decoration:none;border-bottom:1px solid rgba(244,243,240,0.35);padding-bottom:2px" style-hover="color:#b5b2a8">hq@hizen.vc</a></p>
    <form id="gi" style="margin-top:44px;display:flex;flex-direction:column;gap:30px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
        <label class="f">Name
          <input name="name" type="text" autocomplete="name" required maxlength="120">
        </label>
        <!-- optional, matching the Typeform this replaces — an angel writing
             from a personal address has no organisation to give -->
        <label class="f"><span>Organisation <span class="opt">optional</span></span>
          <input name="org" type="text" autocomplete="organization" maxlength="160">
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
        <label class="f">Type
          <select name="type" required>
            <option value="" disabled selected>Select</option>
            <option>VC</option>
            <option>Angel</option>
            <option>Family Office</option>
            <option>Investment Pro</option>
            <option>Others</option>
          </select>
        </label>
        <!-- one element, not a text node beside a span: a flex column would
             otherwise put "optional" on its own row and drop the input 14px -->
        <label class="f"><span>Phone <span class="opt">optional</span></span>
          <input name="phone" type="tel" autocomplete="tel" maxlength="32" placeholder="+91">
        </label>
      </div>
      <label class="f">Email
        <input name="email" type="email" autocomplete="email" required maxlength="200">
      </label>
      <!-- Bots fill every field they can see; a human never sees this one. -->
      <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <div style="display:flex;align-items:center;gap:22px;margin-top:6px">
        <button type="submit" style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0.05em;color:#12120f;background:#f4f3f0;padding:12px 26px;border-radius:999px;border:none;cursor:pointer" style-hover="background:#d9d6cd">Send</button>
        <span id="gi-note" role="status" style="font-family:Inter,sans-serif;font-style:italic;font-size:12.5px;color:rgba(244,243,240,0.45)">We read every one of these.</span>
      </div>
    </form>
  </div>
</main>
<script>
// Deployment URL of form.gs (Apps Script -> Deploy -> Web app -> Anyone).
// Empty falls back to the mail client, so the page is never a dead end.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbx7QLYATeOE-b9aQNpnvzy7unRkfpgVxEFFpPXWVEFXWB-Tp4CK4AmEJ9hWOijW41yZ/exec';

(() => {
  const form = document.getElementById('gi'), note = document.getElementById('gi-note');
  const say = (text, dim) => { note.textContent = text; note.style.color = dim ? 'rgba(244,243,240,0.45)' : '#f4f3f0'; };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const lead = Object.fromEntries(new FormData(form));
    if (!ENDPOINT) {
      const body = ['Name: ' + lead.name, 'Organisation: ' + lead.org, 'Type: ' + lead.type,
                    'Email: ' + lead.email, 'Phone: ' + (lead.phone || '-')].join('\n');
      location.href = 'mailto:hq@hizen.vc?subject=' + encodeURIComponent('hizen - ' + lead.org) +
                      '&body=' + encodeURIComponent(body);
      return;
    }
    const button = form.querySelector('button');
    button.disabled = true;
    say('Sending...', true);
    try {
      // text/plain keeps this a "simple" request, so the browser sends no
      // OPTIONS preflight — which an Apps Script web app cannot answer.
      const reply = await fetch(ENDPOINT, {
        method: 'POST', body: JSON.stringify(lead), headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      });
      if (!reply.ok) throw new Error(reply.status);
      form.reset();
      say('Got it. We come back within a day.');
    } catch {
      button.disabled = false;
      say('That did not send - write to hq@hizen.vc and we will pick it up.');
    }
  });
})();
</script>
</body>
</html>
