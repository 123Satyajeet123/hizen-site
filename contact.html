<style>
  /* The builder writes hover intent as a `style-hover` attribute its own runtime
     never reads, so these are the only place those states exist. */
  .clink:hover { color: #b5b2a8 }
  .cbtn:hover { background: #d9d6cd; color: #12120f }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px }
</style>
</head>
<body>
<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 50%, rgba(0,0,0,0.5) 86%, rgba(0,0,0,0.68) 100%)"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:24px 7vw">
  <a href="./index.html" style="font-family:'Space Grotesk',Inter,sans-serif;font-weight:500;font-size:20px;letter-spacing:0.005em;color:#f4f3f0;text-decoration:none;line-height:1">h<span style="position:relative;display:inline-block">ı<span style="position:absolute;left:50%;top:0.06em;transform:translateX(-50%);width:0.17em;height:0.17em;border-radius:50%;background:#8f8c85"></span></span>zen<span style="color:#8f8c85">.vc</span></a>
  <nav style="display:flex;align-items:center;gap:28px"><a href="mailto:hq@hizen.vc" style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0.05em;color:#f4f3f0;text-decoration:none;border-bottom:1px solid rgba(244,243,240,0.35);padding-bottom:3px;white-space:nowrap" style-hover="color:#b5b2a8">Contact us</a><a href="./demo.html" style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0.05em;color:#12120f;background:#f4f3f0;padding:10px 20px;border-radius:999px;text-decoration:none;white-space:nowrap" style-hover="background:#d9d6cd;color:#12120f">See demo</a></nav>
</header>
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 7vw 80px;box-sizing:border-box">
  <div style="width:min(560px,100%)">
    <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(244,243,240,0.5);margin-bottom:16px">+ Contact</div>
    <h1 style="margin:0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(38px,5vw,62px);line-height:1.02;letter-spacing:-0.04em;color:#ffffff">Get in touch.</h1>
    <p style="margin:20px 0 0;font-family:Inter,sans-serif;font-weight:400;font-size:15px;line-height:1.7;color:rgba(244,243,240,0.78)">Tell us about your fund and we'll come back within a day - or write to us directly at <a href="mailto:hq@hizen.vc" style="font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#f4f3f0;text-decoration:none;border-bottom:1px solid rgba(244,243,240,0.35);padding-bottom:2px" style-hover="color:#b5b2a8">hq@hizen.vc</a></p>
    <form onSubmit="{{ send }}" style="margin-top:44px;display:flex;flex-direction:column;gap:30px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
        <label style="display:flex;flex-direction:column;gap:9px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,243,240,0.55)">Name
          <input name="name" type="text" autocomplete="name" style="background:transparent;border:none;border-bottom:1px solid rgba(244,243,240,0.28);padding:8px 0 10px;font-family:Inter,sans-serif;font-size:15px;color:#f4f3f0;border-radius:0"></input>
        </label>
        <label style="display:flex;flex-direction:column;gap:9px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,243,240,0.55)">Fund
          <input name="fund" type="text" autocomplete="organization" style="background:transparent;border:none;border-bottom:1px solid rgba(244,243,240,0.28);padding:8px 0 10px;font-family:Inter,sans-serif;font-size:15px;color:#f4f3f0;border-radius:0"></input>
        </label>
      </div>
      <label style="display:flex;flex-direction:column;gap:9px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,243,240,0.55)">Email
        <input name="email" type="email" autocomplete="email" required="required" style="background:transparent;border:none;border-bottom:1px solid rgba(244,243,240,0.28);padding:8px 0 10px;font-family:Inter,sans-serif;font-size:15px;color:#f4f3f0;border-radius:0"></input>
      </label>
      <label style="display:flex;flex-direction:column;gap:9px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,243,240,0.55)">What would you like to see?
        <textarea name="msg" rows="4" style="background:transparent;border:none;border-bottom:1px solid rgba(244,243,240,0.28);padding:8px 0 10px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:#f4f3f0;resize:vertical;border-radius:0"></textarea>
      </label>
      <div style="display:flex;align-items:center;gap:22px;margin-top:6px">
        <button type="submit" style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:0.05em;color:#12120f;background:#f4f3f0;padding:12px 26px;border-radius:999px;border:none;cursor:pointer" style-hover="background:#d9d6cd">Send</button>
        <span style="font-family:Inter,sans-serif;font-style:italic;font-size:12.5px;color:rgba(244,243,240,0.45)">Opens your mail client for now - the form backend arrives with the site.</span>
      </div>
    </form>
  </div>
</main>
<script>
class DCLogic { constructor(props) { this.props = props; } }
class Component extends DCLogic {
  renderVals() {
    return {
      send: e => {
        e.preventDefault();
        const f = e.target;
        const v = n => (f.elements[n] && f.elements[n].value || '').trim();
        const subject = 'Hizen - ' + (v('fund') || v('name') || 'inquiry');
        const body = 'Name: ' + v('name') + '\nFund: ' + v('fund') + '\nEmail: ' + v('email') + '\n\n' + v('msg');
        window.location.href = 'mailto:hq@hizen.vc?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }
    };
  }
}
new Component({}).componentDidMount();
</script>
</body>
</html>
